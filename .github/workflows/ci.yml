name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test

      - name: Reject tracked secrets and LICENSE
        run: |
          set -euo pipefail
          tracked_env="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env.example$' || true)"
          if [ -n "$tracked_env" ]; then
            echo ".env files must not be tracked:"
            echo "$tracked_env"
            exit 1
          fi
          if [ -f LICENSE ] || [ -f LICENSE.md ]; then
            echo "LICENSE file must not exist"
            exit 1
          fi
